<div class="categories-container">
  <h2>Expense Categories</h2>
  
  <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <input type="text" formControlName="name" placeholder="Category Name" required>
    </div>
    <div class="form-group">
      <input type="text" formControlName="description" placeholder="Description">
    </div>
    <div class="form-group">
      <input type="color" formControlName="color">
    </div>
    <button type="submit" [disabled]="categoryForm.invalid">
      {{ isEditing ? 'Update' : 'Add' }} Category
    </button>
    <button type="button" *ngIf="isEditing" (click)="resetForm()">Cancel</button>
  </form>

  <div class="categories-list">
    <div *ngFor="let category of categories" class="category-item">
      <div class="category-color" [style.backgroundColor]="category.color"></div>
      <div class="category-info">
        <h3>{{ category.name }}</h3>
        <p *ngIf="category.description">{{ category.description }}</p>
      </div>
      <div class="category-actions">
        <button (click)="editCategory(category)">Edit</button>
        <button (click)="deleteCategory(category.id)">Delete</button>
      </div>
    </div>
  </div>
</div>
